name: Baseline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: No-network Python smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import modules without source/API calls
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys

          for path in sorted(pathlib.Path('.').glob('*.py')):
              print(f'import {path}')
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              try:
                  assert spec.loader is not None
                  spec.loader.exec_module(module)
              except Exception as exc:
                  print(f'{path}: {exc}', file=sys.stderr)
                  raise
          PY

      - name: CLI help smoke checks
        run: |
          for script in *.py; do
            echo "::group::$script --help"
            python "$script" --help >/dev/null
            echo "::endgroup::"
          done

      - name: Markdown and relative-link smoke check
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          failures = []
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for path in sorted(pathlib.Path('.').rglob('*.md')):
              if '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError as exc:
                  failures.append(f'{path}: not UTF-8 ({exc})')
                  continue
              for target in link_re.findall(text):
                  target = target.strip().split()[0]
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  target = target.split('#', 1)[0]
                  if target and not (path.parent / target).exists():
                      failures.append(f'{path}: missing relative link target {target}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Conservative secret-pattern scan
        run: |
          if grep -RInE --exclude-dir=.git -e '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}' -- .; then
            echo 'Potential secret material found.' >&2
            exit 1
          fi
